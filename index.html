<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoWiz · Rolling Stone 500</title>

    <!-- Fonts (loaded from Google Fonts):
         Bricolage Grotesque = quirky, characterful display face for the title and headings.
         DM Mono             = monospaced face for labels and numbers (data should look like data).
         To change the personality of the whole dashboard, swap these two names here
         AND in the two --font-* lines at the top of src/styles.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React renders the whole dashboard inside this one empty div. -->
    <div id="root"></div>
    <!-- Entry point of our JavaScript. Vite handles bundling it. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
